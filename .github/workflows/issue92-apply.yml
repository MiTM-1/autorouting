name: Apply issue 92 fix

on:
  push:
    branches:
      - fix/issue-92-wild-jumps

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-92-wild-jumps
      - uses: oven-sh/setup-bun@v2
      - name: Apply focused fix and add regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('algos/multi-layer-ijump/MultilayerIjump.ts')
          s = p.read_text()
          old = '''        if (travelDir.wallDistance === Infinity) {
          travelDirs3.push({
            ...travelDir,
            travelDistance: goalDistAlongTravelDir,
            enterMarginCost: 0,
            travelMarginCostFactor: 1,
          })
        } else if (travelDir.wallDistance > this.largestMargin) {'''
          new = '''        if (
          travelDir.wallDistance === Infinity &&
          isGoalInTravelDir &&
          goalDistAlongTravelDir > 0
        ) {
          travelDirs3.push({
            ...travelDir,
            travelDistance: goalDistAlongTravelDir,
            enterMarginCost: 0,
            travelMarginCostFactor: 1,
          })
        } else if (travelDir.wallDistance > this.largestMargin) {'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif 'travelDir.wallDistance === Infinity &&\n          isGoalInTravelDir' not in s:
              raise SystemExit('target branch not found')
          PY
          cat > algos/multi-layer-ijump/tests/repros/issue92-no-mirrored-goal-jump.test.tsx <<'EOF'
          import { Circuit } from "@tscircuit/core"
          import { expect, test } from "bun:test"
          import { getSimpleRouteJson } from "solver-utils"
          import { MultilayerIjump } from "../../MultilayerIjump"

          const Pad = (props: { name: string; pcbX: number; pcbY: number; width?: string; height?: string }) => (
            <chip name={props.name} pcbX={props.pcbX} pcbY={props.pcbY}>
              <footprint>
                <smtpad pcbX={0} pcbY={0} shape="rect" width={props.width ?? "1mm"} height={props.height ?? "1mm"} layer="top" portHints={["pin1"]} />
              </footprint>
            </chip>
          )

          class InspectingMultilayerIjump extends MultilayerIjump {
            mirroredGoalJumps: Array<{ from: { x: number; y: number }; to: { x: number; y: number } }> = []

            override getNeighbors(node: any) {
              const neighbors = super.getNeighbors(node)
              const goal = this.goalPoint as any
              const epsilon = 1e-6

              for (const neighbor of neighbors) {
                const dx = neighbor.x - node.x
                const dy = neighbor.y - node.y
                const goalDx = goal.x - node.x
                const goalDy = goal.y - node.y
                const mirroredHorizontalJump = Math.abs(dy) < epsilon && Math.abs(dx) > epsilon && Math.sign(dx) === -Math.sign(goalDx) && Math.abs(Math.abs(dx) - Math.abs(goalDx)) < epsilon
                const mirroredVerticalJump = Math.abs(dx) < epsilon && Math.abs(dy) > epsilon && Math.sign(dy) === -Math.sign(goalDy) && Math.abs(Math.abs(dy) - Math.abs(goalDy)) < epsilon
                if (mirroredHorizontalJump || mirroredVerticalJump) {
                  this.mirroredGoalJumps.push({ from: { x: node.x, y: node.y }, to: { x: neighbor.x, y: neighbor.y } })
                }
              }
              return neighbors
            }
          }

          test("issue 92: does not jump to the mirrored goal coordinate", () => {
            const circuit = new Circuit()
            circuit.add(
              <board width="16mm" height="12mm" routingDisabled>
                <Pad name="U1" pcbX={-6} pcbY={0} />
                <Pad name="U2" pcbX={6} pcbY={4} />
                <Pad name="U_obstacle" pcbX={0} pcbY={0} width="2mm" height="2mm" />
                <trace from=".U1 > .pin1" to=".U2 > .pin1" />
              </board>,
            )
            const input = getSimpleRouteJson(circuit.getCircuitJson(), { layerCount: 2 })
            const autorouter = new InspectingMultilayerIjump({ input, debug: true })
            autorouter.allowLayerChange = false
            const solution = autorouter.solveAndMapToTraces()
            expect(solution).toHaveLength(1)
            expect(autorouter.mirroredGoalJumps).toEqual([])
          })
          EOF
      - name: Install dependencies
        run: bun install
      - name: Format focused files
        run: bunx biome format --write algos/multi-layer-ijump/MultilayerIjump.ts algos/multi-layer-ijump/tests/repros/issue92-wild-trace-jump.test.tsx algos/multi-layer-ijump/tests/repros/issue92-no-mirrored-goal-jump.test.tsx
      - name: Run focused tests
        run: bun test algos/multi-layer-ijump/tests/repros/issue92-wild-trace-jump.test.tsx algos/multi-layer-ijump/tests/repros/issue92-no-mirrored-goal-jump.test.tsx
      - name: Run multi-layer ijump suite
        run: bun test algos/multi-layer-ijump/tests
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algos/multi-layer-ijump/MultilayerIjump.ts algos/multi-layer-ijump/tests/repros/issue92-wild-trace-jump.test.tsx algos/multi-layer-ijump/tests/repros/issue92-no-mirrored-goal-jump.test.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(multi-layer-ijump): remove mirrored wild jumps"
          git push origin HEAD:fix/issue-92-wild-jumps
